name: Backend Tests & Security Scan

on:
  push:
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'automation/**'
      - 'multimodal/**'
      - 'tools/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'automation/**'
      - 'multimodal/**'
      - 'tools/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_omniagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_omniagent
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --cov=backend/app --cov-report=xml
