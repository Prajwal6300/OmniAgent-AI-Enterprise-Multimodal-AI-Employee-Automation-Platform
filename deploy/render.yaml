services:
  # OmniAgent AI — Web API Service (Render Web Service)
  - type: web
    name: omniagent-api
    env: python
    region: oregon
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false # Set via Render dashboard (Neon PostgreSQL URL)
      - key: REDIS_URL
        sync: false # Set via Render dashboard (Upstash or Managed Redis)
      - key: CELERY_BROKER_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  # OmniAgent AI — Background Asynchronous Worker (Celery)
  - type: worker
    name: omniagent-worker
    env: python
    region: oregon
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: omniagent-api
          envVarKey: SECRET_KEY
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: omniagent-api
          envVarKey: ENCRYPTION_KEY
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  # OmniAgent AI — Scheduled Task Dispatcher (Celery Beat)
  - type: worker
    name: omniagent-beat
    env: python
    region: oregon
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: omniagent-api
          envVarKey: SECRET_KEY
